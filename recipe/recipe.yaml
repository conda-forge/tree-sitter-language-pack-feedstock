context:
  name: tree-sitter-language-pack
  version: "1.15.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://github.com/xberg-io/tree-sitter-language-pack/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 1bda95faf207c19702545ab98ac95134fccc5f953e80dee0e2e78150d2f45772
    patches:
      # Rewrites the tarball's own vendored patches/typst/serialize-buffer-overflow.patch
      # to upstream main's fixed form (61e331426). The 1.15.0 version narrows the
      # serialized length prefix to uint32_t while vec_u32_deserialize still reads it
      # back as `sizeof self->len` (8 bytes); the garbage upper half becomes a huge
      # element count that overruns the 1024-byte serialization buffer, so any typst
      # parse that round-trips scanner state faults. `#let x = 1` does.
      # Upstream: https://github.com/xberg-io/tree-sitter-language-pack/issues/180
      # REMOVE this patch and the static-build wiring below once 1.15.1 is released.
      - patches/typst/serialize-buffer-overflow.patch
  # All 371 grammar sources, vendored so the static build needs no network:
  # build.rs would otherwise git-clone each grammar or download this same bundle.
  # This is upstream's own release asset; sha256 matches their published .sha256
  # sidecar. Queries ship here too (parsers/<lang>/queries/*.scm) and are embedded
  # only for languages present in the tree, which is why the whole corpus must be
  # vendored rather than just typst.
  # Staged into _parser_sources/ rather than extracted in place: this archive's root
  # holds sources/ and patches/ alongside parsers/, so unpacking it at $SRC_DIR would
  # overwrite the main source's patches/ tree with the release's original, unfixed
  # typst patch -- reverting the fix above with no error anywhere. The build script
  # moves only parsers/ into place.
  - url: https://github.com/xberg-io/tree-sitter-language-pack/releases/download/v${{ version }}/parser-sources-${{ version }}.tar.zst
    sha256: 8c43d24b3f1888d4ef5cbc01b772ed5ed6b150a546f9ed631e555fcc44ae2a58
    target_directory: _parser_sources

build:
  script:
    env:
      # Compile ALL grammars into the extension module. Unset means an empty selection,
      # and build.rs then skips grammar patching entirely ("An empty selection compiles
      # no grammar sources at all, so there is nothing to patch") and the parsers are
      # instead downloaded prebuilt -- and unfixed -- at runtime. Setting this is what
      # makes the source patch above take effect at all.
      # It must be `all`, not just `typst`: this same variable also filters which
      # grammars scripts/clone_vendors.py vendors, and build.rs embeds queries only for
      # languages found under parsers/<lang>/queries/. Selecting one language silently
      # strips highlights/folds/indents/injections/locals/tags from every other one --
      # get_..._query() returns None with no error. Verified the hard way.
      TSLP_LANGUAGES: all
      # REQUIRED, and easy to miss: TSLP_LANGUAGES only selects WHICH grammars are
      # compiled, not HOW they are linked. build.rs defaults TSLP_LINK_MODE to
      # "dynamic", which builds each grammar as a loadable library and leaves
      # STATIC_LANGUAGES empty -- so get_language() finds nothing in the static table
      # and falls back to the prebuilt bundle downloaded at runtime. Without this,
      # the whole static-build wiring silently has no effect (it compiles fine and
      # emits no warning, because build.rs only logs on failure).
      TSLP_LINK_MODE: static
      # Belt and braces: refuse any build-time source fetch. The full parsers/ tree is
      # vendored as a source entry above, which already satisfies the offline path.
      TSLP_OFFLINE: "1"
    content:
      # The parser-sources bundle carries its own sources/ and patches/ next to
      # parsers/, so extracting it at $SRC_DIR would clobber the patched patches/
      # tree from the main source and silently revert the typst fix. Stage it and
      # move only the grammar tree into the place build.rs looks for it.
      - if: unix
        then: mv _parser_sources/parsers parsers
        else: move _parser_sources\parsers parsers
      - cd packages/python
      - cargo-bundle-licenses --format yaml --output ../../THIRDPARTY.yml
      - maturin build --release --interpreter ${{ PYTHON }} --out ${{ "${SRC_DIR}/dist" if unix else "%SRC_DIR%\dist" }}
      - cd ../..
      - ${{ PYTHON }} -m pip install --find-links=dist tree_sitter_language_pack
  number: 0

requirements:
  build:
    - ${{ compiler("c") }}
    # Four grammars (mojo, nim, norg, vala) ship C++ external scanners. Only needed
    # since we compile grammars at build time; without it build.rs fails them with
    # ToolNotFound "c++" and hard-panics on its no-failed-grammars guard.
    - ${{ compiler("cxx") }}
    - ${{ compiler("rust") }}
    - ${{ stdlib("c") }}
    - cargo-bundle-licenses
    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}
        - crossenv
        - maturin
        - python
  host:
    - maturin
    - pip
    - python
  run:
    - python
    - tree_sitter >=0.23.2
    - tree-sitter-c-sharp >=0.23.1
    - tree-sitter-embedded-template >=0.23.2
    - tree-sitter-yaml >=0.7.2

tests:
  - python:
      imports:
        - tree_sitter_language_pack
      pip_check: true
  - script:
      - if: win
        then: set "TREE_SITTER_LANGUAGE_PACK_CACHE_DIR=%TEMP%\tslp-cache"
      - pytest e2e/python/tests
          --deselect tests/test_smoke.py::test_smoke_avro
          --deselect tests/test_smoke.py::test_smoke_tsql
    requirements:
      run:
        - pytest
        - pytest-asyncio
        - pytest-timeout
        - python
    files:
      source:
        - e2e/python/

about:
  homepage: https://github.com/xberg-io/tree-sitter-language-pack
  summary: 'Comprehensive tree-sitter grammar compilation with polyglot bindings'
  description: |
    Comprehensive tree-sitter grammar compilation with polyglot bindings —
    Rust, Python, Node.js, Go, Java, Ruby, Elixir, PHP, C#, WASM, Dart,
    Kotlin-Android, Swift, Zig, and CLI. 371 languages.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/xberg-io/tree-sitter-language-pack

extra:
  recipe-maintainers:
    - MementoRC
    - pavelzw
